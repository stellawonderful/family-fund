<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭公基金</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --border: #e2ddd6;
    --text: #1a1814;
    --muted: #7a756c;
    --hint: #b0ab9e;
    --green: #2d6a4f;
    --green-bg: #eaf4ee;
    --red: #c0392b;
    --red-bg: #fdf0ee;
    --accent: #3d5a80;
    --accent-bg: #edf2f8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .header-title span {
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    margin-left: 10px;
    color: var(--muted);
  }

  #auth-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s;
    font-weight: 500;
  }
  #auth-btn:hover { opacity: 0.85; }
  #auth-btn.signed-in { background: var(--green); }

  main { max-width: 760px; margin: 0 auto; padding: 28px 20px; }

  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }

  .metric-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .metric-value {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 130px 90px 1fr 120px auto;
    gap: 8px;
    align-items: end;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

  input, select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }

  .add-btn {
    background: var(--text);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
    transition: opacity 0.15s;
    height: 38px;
  }
  .add-btn:hover { opacity: 0.8; }

  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
  }
  .filter-btn.active {
    background: var(--text);
    color: white;
    border-color: var(--text);
  }

  .records { }

  .record-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .record-row:last-child { border-bottom: none; }

  .rec-left { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .rec-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--hint); }
  .rec-desc { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .rec-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .rec-amount {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    min-width: 90px;
    text-align: right;
  }
  .rec-amount.in { color: var(--green); }
  .rec-amount.out { color: var(--red); }

  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--hint);
    font-size: 14px;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .del-btn:hover { background: var(--red-bg); color: var(--red); }

  .empty {
    text-align: center;
    color: var(--hint);
    font-size: 13px;
    padding: 24px 0;
  }

  .status-bar {
    background: var(--accent-bg);
    border: 1px solid #c8d8ec;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 16px;
    display: none;
  }
  .status-bar.show { display: block; }

  .sync-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--hint);
    margin-right: 6px;
    vertical-align: middle;
  }
  .sync-dot.synced { background: var(--green); }
  .sync-dot.syncing { background: #f39c12; animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  @media(max-width: 600px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .field:nth-child(3) { grid-column: 1/-1; }
    .form-grid .add-btn { grid-column: 1/-1; width: 100%; }
    .metrics { grid-template-columns: 1fr; }
    header { padding: 16px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-title">
    家庭公基金
    <span id="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">未登入</span></span>
  </div>
  <button id="auth-btn" onclick="handleAuth()">登入 Google</button>
</header>

<main>
  <div class="status-bar" id="status-bar"></div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">總收入</div>
      <div class="metric-value green" id="total-in">$0</div>
    </div>
    <div class="metric">
      <div class="metric-label">總支出</div>
      <div class="metric-value red" id="total-out">$0</div>
    </div>
    <div class="metric">
      <div class="metric-label">目前結餘</div>
      <div class="metric-value" id="balance">$0</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">新增記錄</div>
    <div class="form-grid">
      <div class="field">
        <label>日期</label>
        <input type="date" id="f-date" />
      </div>
      <div class="field">
        <label>類型</label>
        <select id="f-type">
          <option value="in">收入</option>
          <option value="out">支出</option>
        </select>
      </div>
      <div class="field">
        <label>說明</label>
        <input type="text" id="f-desc" placeholder="例：家庭聚餐" />
      </div>
      <div class="field">
        <label>金額 (NT$)</label>
        <input type="number" id="f-amount" placeholder="0" min="0" />
      </div>
      <button class="add-btn" onclick="addRecord()">新增</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">交易記錄</div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
      <button class="filter-btn" onclick="setFilter('in',this)">收入</button>
      <button class="filter-btn" onclick="setFilter('out',this)">支出</button>
    </div>
    <div id="records-list"></div>
  </div>
</main>

<script>
const CLIENT_ID = '791514506466-hv50cfqni5vbpv5l3114t83j6ujk2l0l.apps.googleusercontent.com';
const API_KEY = 'AIzaSyDHah6f7fhhCVyu3X4Er-Y23OnqOG_i5t8';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
const FILE_NAME = 'family-fund-data.json';

let tokenClient;
let gapiInited = false;
let gisInited = false;
let accessToken = null;
let driveFileId = null;
let filter = 'all';
let nextId = 100;

const DEFAULT_RECORDS = [
  { id: 1, date: '2025-02-01', type: 'in', desc: '公基金 × 2戶 (2025/02)', amount: 4000 },
  { id: 2, date: '2025-03-01', type: 'in', desc: '公基金 × 2戶 (2025/03)', amount: 4000 },
  { id: 3, date: '2025-04-01', type: 'in', desc: '公基金 × 2戶 (2025/04)', amount: 4000 },
  { id: 4, date: '2025-05-01', type: 'in', desc: '公基金 × 2戶 (2025/05)', amount: 4000 },
  { id: 5, date: '2025-06-01', type: 'in', desc: '公基金 × 2戶 (2025/06)', amount: 4000 },
  { id: 6, date: '2025-07-01', type: 'in', desc: '公基金 × 2戶 (2025/07)', amount: 4000 },
  { id: 7, date: '2025-08-01', type: 'in', desc: '公基金 × 2戶 (2025/08)', amount: 4000 },
  { id: 8, date: '2025-08-23', type: 'out', desc: '喜來登家庭聚餐', amount: 16737 },
  { id: 9, date: '2025-09-01', type: 'in', desc: '公基金 × 2戶 (2025/09)', amount: 4000 },
  { id: 10, date: '2025-10-01', type: 'in', desc: '公基金 × 2戶 (2025/10)', amount: 4000 },
  { id: 11, date: '2025-11-01', type: 'in', desc: '公基金 × 2戶 (2025/11)', amount: 4000 },
  { id: 12, date: '2025-12-01', type: 'in', desc: '公基金 × 2戶 (2025/12)', amount: 4000 },
  { id: 13, date: '2026-01-01', type: 'in', desc: '公基金 × 2戶 (2026/01)', amount: 4000 },
  { id: 14, date: '2026-02-01', type: 'in', desc: '公基金 × 2戶 (2026/02)', amount: 4000 },
  { id: 15, date: '2026-03-01', type: 'in', desc: '公基金 × 2戶 (2026/03)', amount: 4000 },
  { id: 16, date: '2026-04-01', type: 'in', desc: '公基金 × 2戶 (2026/04)', amount: 4000 },
  { id: 17, date: '2026-05-03', type: 'out', desc: 'The Lin Hotel & Banquet', amount: 5016 },
];

let records = JSON.parse(localStorage.getItem('fund-records') || 'null') || DEFAULT_RECORDS;

function fmt(n) { return 'NT$' + n.toLocaleString(); }

function setStatus(msg, show=true) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = 'status-bar' + (show ? ' show' : '');
}

function setSyncStatus(state, text) {
  document.getElementById('sync-dot').className = 'sync-dot ' + state;
  document.getElementById('sync-text').textContent = text;
}

function render() {
  let totalIn = 0, totalOut = 0;
  records.forEach(r => r.type === 'in' ? totalIn += r.amount : totalOut += r.amount);
  document.getElementById('total-in').textContent = fmt(totalIn);
  document.getElementById('total-out').textContent = fmt(totalOut);
  const bal = totalIn - totalOut;
  const balEl = document.getElementById('balance');
  balEl.textContent = fmt(bal);
  balEl.style.color = bal >= 0 ? 'var(--text)' : 'var(--red)';

  const sorted = [...records].sort((a,b) => b.date.localeCompare(a.date));
  const filtered = filter === 'all' ? sorted : sorted.filter(r => r.type === filter);
  const list = document.getElementById('records-list');

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">沒有記錄</div>';
    return;
  }

  list.innerHTML = filtered.map(r => `
    <div class="record-row">
      <div class="rec-left">
        <span class="rec-date">${r.date}</span>
        <span class="rec-desc">${r.desc}</span>
      </div>
      <div class="rec-right">
        <span class="rec-amount ${r.type}">${r.type === 'in' ? '+' : '−'}${fmt(r.amount)}</span>
        <button class="del-btn" onclick="deleteRecord(${r.id})" title="刪除">✕</button>
      </div>
    </div>
  `).join('');
}

function saveLocal() {
  localStorage.setItem('fund-records', JSON.stringify(records));
}

async function addRecord() {
  const date = document.getElementById('f-date').value;
  const type = document.getElementById('f-type').value;
  const desc = document.getElementById('f-desc').value.trim();
  const amount = parseInt(document.getElementById('f-amount').value);
  if (!date || !desc || !amount || amount <= 0) { alert('請填寫所有欄位'); return; }
  records.push({ id: nextId++, date, type, desc, amount });
  document.getElementById('f-desc').value = '';
  document.getElementById('f-amount').value = '';
  saveLocal();
  render();
  if (accessToken) await saveToDrive();
}

async function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  saveLocal();
  render();
  if (accessToken) await saveToDrive();
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function gapiLoaded() {
  await gapi.load('client', async () => {
    await gapi.client.init({ apiKey: API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
    gapiInited = true;
    maybeEnableButtons();
  });
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { console.error(resp); return; }
      accessToken = resp.access_token;
      document.getElementById('auth-btn').textContent = '已登入';
      document.getElementById('auth-btn').classList.add('signed-in');
      setSyncStatus('syncing', '同步中...');
      await loadFromDrive();
    },
  });
  gisInited = true;
  maybeEnableButtons();
}

function maybeEnableButtons() {}

function handleAuth() {
  if (!gapiInited || !gisInited) {
    setStatus('Google API 尚未載入，請稍後再試或檢查網路連線');
    return;
  }
  if (accessToken) {
    google.accounts.oauth2.revoke(accessToken, () => {
      accessToken = null;
      driveFileId = null;
      document.getElementById('auth-btn').textContent = '登入 Google';
      document.getElementById('auth-btn').classList.remove('signed-in');
      setSyncStatus('', '未登入');
      setStatus('已登出，資料改為本地儲存');
    });
  } else {
    tokenClient.requestAccessToken({ prompt: 'consent' });
  }
}

async function findOrCreateFile() {
  const res = await gapi.client.drive.files.list({
    spaces: 'appDataFolder',
    q: `name='${FILE_NAME}'`,
    fields: 'files(id,name)',
  });
  if (res.result.files.length > 0) {
    driveFileId = res.result.files[0].id;
    return false;
  }
  const createRes = await gapi.client.request({
    path: 'https://www.googleapis.com/drive/v3/files',
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: FILE_NAME, parents: ['appDataFolder'] }),
  });
  driveFileId = createRes.result.id;
  return true;
}

async function loadFromDrive() {
  try {
    const isNew = await findOrCreateFile();
    if (isNew) {
      await saveToDrive();
      setSyncStatus('synced', '已同步');
      setStatus('已連接 Google Drive，資料已上傳');
      return;
    }
    const res = await gapi.client.request({
      path: `https://www.googleapis.com/drive/v3/files/${driveFileId}`,
      method: 'GET',
      params: { alt: 'media' },
    });
    const data = JSON.parse(res.body);
    records = data.records || records;
    nextId = Math.max(...records.map(r => r.id), 99) + 1;
    saveLocal();
    render();
    setSyncStatus('synced', '已同步');
    setStatus('已連接 Google Drive，資料已載入');
  } catch(e) {
    setSyncStatus('', '同步失敗');
    setStatus('無法連接 Google Drive：' + e.message);
  }
}

async function saveToDrive() {
  if (!driveFileId) return;
  setSyncStatus('syncing', '儲存中...');
  try {
    const content = JSON.stringify({ records, updatedAt: new Date().toISOString() });
    await gapi.client.request({
      path: `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}`,
      method: 'PATCH',
      params: { uploadType: 'media' },
      headers: { 'Content-Type': 'application/json' },
      body: content,
    });
    setSyncStatus('synced', '已儲存');
  } catch(e) {
    setSyncStatus('', '儲存失敗');
  }
}

document.getElementById('f-date').value = new Date().toISOString().split('T')[0];

render();
</script>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
